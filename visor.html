<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandTalk - Visor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: #0f1015;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }

        h1 {
            margin: 8px 0 14px 0;
            font-size: 18px;
            font-weight: 600;
            color: #dfe6e9;
        }

        /* Contenedor que agrupa video + subtítulo superpuesto */
        .visor {
            position: relative;
            width: 100%;
            max-width: 720px;
            background: #1b1c24;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        #camara {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        /* El subtítulo va POSICIONADO ENCIMA del video, no dentro de la imagen */
        #subtitulo {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 26px;
            font-weight: 800;
            max-width: 90%;
            text-align: center;
            min-height: 1.2em;
            transition: background 0.2s, color 0.2s, border 0.2s;
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* Estilos de contraste alternables con la tecla 'T' */
        .contrast-default {
            background: rgba(15, 16, 21, 0.85);
            color: #ffffff;
            border: 2px solid rgba(108, 92, 231, 0.6);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .contrast-yellow {
            background: #000000;
            color: #fed330;
            border: 3px solid #fed330;
            text-shadow: none;
        }

        .contrast-light {
            background: #ffffff;
            color: #111111;
            border: 3px solid #111111;
            text-shadow: none;
        }

        #estado {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background-color: #f39c12;
        }

        .dot.connected { background-color: #2ecc71; }
        .dot.error { background-color: #e74c3c; }

        /* Barra de atajos de teclado */
        .shortcuts-bar {
            margin-top: 16px;
            font-size: 12px;
            color: #636e72;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .shortcut-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .kbd {
            background: #2d3436;
            color: #dfe6e9;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid #485460;
            font-size: 11px;
            font-weight: 700;
        /* Badge de modelo IA y señas preentrenadas */
        .model-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #b2bec3;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sign-badge {
            background: rgba(108, 92, 231, 0.25);
            color: #a29bfe;
            border: 1px solid rgba(108, 92, 231, 0.6);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <h1>HandTalk — Visor en Vivo</h1>

    <div class="model-bar" id="modelBar">
        <span>Señas preentrenadas:</span>
        <span class="sign-badge" id="badgeDefault1">dedo</span>
        <span class="sign-badge" id="badgeDefault2">hola</span>
    </div>

    <div class="visor" id="visorContainer">
        <!-- STREAM DE VIDEO: una imagen que el navegador refresca sola (MJPEG) -->
        <img id="camara" alt="Cámara en vivo" src="/stream">

        <!-- SUBTÍTULO: se actualiza por WebSocket, independiente del video -->
        <div id="subtitulo" class="contrast-default">Esperando señas...</div>
    </div>

    <div id="estado">
        <span id="dotEstado" class="dot"></span>
        <span id="textoEstado">Conectando...</span>
    </div>

    <div class="shortcuts-bar">
        <div class="shortcut-item"><span class="kbd">F</span> Pantalla Completa</div>
        <div class="shortcut-item"><span class="kbd">C</span> Limpiar Subtítulo</div>
        <div class="shortcut-item"><span class="kbd">T</span> Alternar Contraste</div>
    </div>

    <script>
        const subtitulo = document.getElementById("subtitulo");
        const textoEstado = document.getElementById("textoEstado");
        const dotEstado = document.getElementById("dotEstado");
        const visorContainer = document.getElementById("visorContainer");
        const modelBar = document.getElementById("modelBar");

        // window.location.host toma automáticamente la IP y puerto reales
        const host = window.location.host;

        // Cargar metadatos del modelo preentrenado real del proyecto
        fetch("/api/info")
            .then(res => res.json())
            .then(data => {
                if (data.pretrained_words && data.pretrained_words.length > 0) {
                    modelBar.innerHTML = '<span>Señas del modelo:</span> ' +
                        data.pretrained_words.map(w => `<span class="sign-badge">${w}</span>`).join(" ");
                }
            })
            .catch(() => {
                // Mantiene los badges predeterminados si la API tarda en responder
            });

        // WebSocket autenticado con cookie session_id (se envía automáticamente por el navegador)
        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${wsProtocol}//${host}/ws/translations`);

        ws.onopen = () => {
            textoEstado.textContent = "Conectado y listo (IA en vivo)";
            dotEstado.className = "dot connected";
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                // IMPORTANTE: textContent estricto, nunca innerHTML (prevención XSS)
                subtitulo.textContent = data.word;
            } catch (e) {
                subtitulo.textContent = event.data;
            }
        };

        ws.onclose = (event) => {
            textoEstado.textContent = "Conexión cerrada. Recargue la página.";
            dotEstado.className = "dot error";
        };

        ws.onerror = () => {
            textoEstado.textContent = "Error de conexión con el servidor";
            dotEstado.className = "dot error";
        };

        document.getElementById("camara").onerror = () => {
            // Ocultar si no hay stream de cámara activa y dejar el área de texto limpia
            document.getElementById("camara").style.display = "none";
        };

        // --- SISTEMA CENTRALIZADO DE ATAJOS DE TECLADO (MÓDULO 5) ---
        const contrastStyles = ["contrast-default", "contrast-yellow", "contrast-light"];
        let currentContrastIndex = 0;

        document.addEventListener("keydown", (e) => {
            const key = e.key.toUpperCase();

            // Tecla F: Activar/desactivar modo pantalla completa (Fullscreen API)
            if (key === "F" && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                if (!document.fullscreenElement) {
                    if (visorContainer.requestFullscreen) {
                        visorContainer.requestFullscreen();
                    } else if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }

            // Tecla C: Limpiar el subtítulo actual de la pantalla
            if (key === "C" && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                subtitulo.textContent = "";
            }

            // Tecla T: Alternar contraste del subtítulo
            if (key === "T" && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                contrastStyles.forEach(cls => subtitulo.classList.remove(cls));
                currentContrastIndex = (currentContrastIndex + 1) % contrastStyles.length;
                subtitulo.classList.add(contrastStyles[currentContrastIndex]);
            }
        });
    </script>
</body>
</html>
